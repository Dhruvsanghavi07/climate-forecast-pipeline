[project]
name = "climate-forecast-pipeline"
version = "1.0.0"
description = "Monthly ETL for NOAA CO2 and temperature data with validation, a SQL warehouse, backtested forecasts and a dashboard"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dhruv Sanghavi" }]
dependencies = ["pandas>=2.1", "numpy>=1.26", "scikit-learn>=1.4", "plotly>=5.20"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
climate-pipeline = "climate.pipeline:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["climate"]

[tool.setuptools.package-data]
climate = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"climate/report.py" = ["E501"]  # long lines are inside the HTML template
